<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <h1>Chess</h1>
        <div id="game-container">
            <div id="eval-bar-container">
                <div id="eval-bar">
                    <div id="eval-black"></div>
                </div>
                <div id="eval-label">0.0</div>
            </div>
            <div id="board"></div>
            <div id="moves-panel">
                <div id="status">Loading...</div>
                <h3>Moves</h3>
                <div id="moves-list"></div>
            </div>
        </div>
        <div id="controls">
            <button id="new-game">New Game</button>
            <button id="resign">Resign</button>
        </div>
        <div id="mode-controls">
            <button id="mode-toggle">2 Player</button>
            <div id="computer-options" class="hidden">
                <select id="play-as">
                    <option value="white">Play as White</option>
                    <option value="black">Play as Black</option>
                </select>
                <select id="difficulty">
                    <option value="5">Easy</option>
                    <option value="12" selected>Medium</option>
                    <option value="18">Hard</option>
                </select>
            </div>
        </div>
        <div id="promotion-modal" class="modal hidden">
            <div class="modal-content">
                <p>Promote pawn to:</p>
                <div class="promo-options">
                    <button data-piece="queen">&#9813; Queen</button>
                    <button data-piece="rook">&#9814; Rook</button>
                    <button data-piece="bishop">&#9815; Bishop</button>
                    <button data-piece="knight">&#9816; Knight</button>
                </div>
            </div>
        </div>
    </div>
    <script src="chess_engine.js"></script>
    <script src="chess.js"></script>
</body>
</html>
